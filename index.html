<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wienie">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3B4A32">
<title>Wienie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Bitter:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Yellowtail&family=Overpass:wght@700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   THEME SYSTEM — 4 switchable palettes, test bed
   ══════════════════════════════════════════════════════ */
:root, [data-theme="parkguide"] {
  --forest:   #3B4A32;
  --pine:     #2F5C3F;
  --pine-lt:  #6E8B5D;
  --gold:     #B5651D;
  --gold-lt:  #F0DCC4;
  --cream:    #DCD1BB;
  --surface:  #FBF7EE;
  --ink:      #2B2620;
  --muted:    #6F6555;
  --dim:      #A39A87;
  --border:   #D4C39E;
  --border-md:#C7B998;
  --accent2:  var(--gold);
  --header-glass: #3B4A32;
  --plane-glass: #FBF7EE;
  --filter-glass: #FBF7EE;
  --serif: 'Fraunces', Georgia, serif;
  --sans:  'Inter', system-ui, sans-serif;
}
[data-theme="midcentury"] {
  --forest:   #1F6E6E;
  --pine:     #E8A33D;
  --pine-lt:  #F0BB66;
  --gold:     #D94F30;
  --gold-lt:  #FBE0CC;
  --cream:    #DDD2BC;
  --surface:  #FFFCF5;
  --ink:      #2B2420;
  --muted:    #756B5E;
  --dim:      #A89D8C;
  --border:   #CFC2A4;
  --border-md:#C2B496;
  --accent2:  var(--gold);
  --header-glass: rgba(31,110,110,0.86);
  --plane-glass: rgba(247,240,225,0.85);
  --filter-glass: rgba(255,252,245,0.9);
  --serif: 'Poppins', system-ui, sans-serif;
  --sans:  'Inter', system-ui, sans-serif;
}
:root {
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --plane-margin: 8px;
  --filter-peek-h: 74px;
  --filter-max-h: 27vh;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s;
}

#theme-switcher {
  position: fixed;
  top: calc(var(--safe-top) + 4px);
  left: var(--plane-margin);
  right: var(--plane-margin);
  z-index: 110;
  display: flex; gap: 6px; justify-content: center;
  pointer-events: none;
}
#theme-switcher button {
  pointer-events: auto;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff; font-family: var(--sans); font-size: 10px; font-weight: 600;
  padding: 4px 9px; border-radius: 12px; cursor: pointer;
}
#theme-switcher button.active { background: rgba(255,255,255,0.9); color: #111; }

#glass-plane {
  position: fixed;
  top: var(--plane-margin); left: var(--plane-margin); right: var(--plane-margin);
  z-index: 100;
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: 0 10px 36px rgba(0,0,0,0.26), 0 3px 10px rgba(0,0,0,0.14);
  background: var(--header-glass);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  padding-top: var(--safe-top);
  transition: background 0.3s;
}
#header-bar { display: flex; align-items: center; padding: 36px 16px 8px; gap: 10px; }
#home-btn { background: none; border: none; cursor: pointer; padding: 4px 0; flex-shrink: 0; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; }
.brand-script { font-family: var(--serif); font-size: 18px; font-weight: 600; font-style: italic; color: var(--gold-lt); letter-spacing: -0.01em; }
.brand-tag { display: none; }
[data-theme="midcentury"] .brand-script { color: #FFE9C7; }
[data-theme="parkguide"] .brand-script { font-family: 'Yellowtail', cursive; font-size: 22px; font-weight: 400; font-style: normal; color: #FFE9C7; letter-spacing: 0; }
[data-theme="parkguide"] .brand-tag { display: inline; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: #E4D4BE; opacity: 0.85; }
#breadcrumb { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
#breadcrumb-sep { color: rgba(255,255,255,0.35); font-size: 14px; flex-shrink: 0; display: none; }
#breadcrumb-label { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; display: none; }
#header-title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: right; min-width: 0; }

#search-row { display: flex; align-items: center; gap: 8px; padding: 0 12px 12px; }
#search-wrap { position: relative; flex: 1; display: flex; align-items: center; }
#search-input {
  width: 100%; height: 40px;
  background: rgba(255,255,255,0.16);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 20px; color: #fff;
  font-family: var(--sans); font-size: 15px;
  padding: 0 36px 0 38px;
  outline: none; -webkit-appearance: none;
  transition: background 0.15s, border-color 0.15s;
}
#search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
#search-input::placeholder { color: rgba(255,255,255,0.5); }
#search-input:focus { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.45); }
#search-icon-wrap { position: absolute; left: 12px; color: rgba(255,255,255,0.55); font-size: 16px; pointer-events: none; line-height: 1; }
#search-clear { position: absolute; right: 10px; background: rgba(255,255,255,0.28); border: none; border-radius: 50%; width: 18px; height: 18px; color: rgba(255,255,255,0.9); font-size: 10px; cursor: pointer; display: none; align-items: center; justify-content: center; }

#proximity-btn {
  position: relative;
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 50%; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  color: rgba(255,255,255,0.6);
  transition: all 0.2s;
}
#proximity-btn svg { width: 19px; height: 19px; }
#proximity-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
#proximity-btn.active::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent2); opacity: 0; animation: prox-pulse 2s ease-out infinite; }
#proximity-btn.no-permission { opacity: 0.28; cursor: default; }
@keyframes prox-pulse { 0% { inset: -2px; opacity: 0.6; } 100% { inset: -11px; opacity: 0; } }

#main { padding-top: 0; padding-bottom: calc(var(--safe-bot) + 24px); min-height: 100vh; }
#view-home { display: none; }
#view-home.active { display: block; }
.home-greeting { padding: 20px 16px 4px; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--ink); letter-spacing: -0.01em; }
.home-sub { padding: 2px 16px 20px; font-size: 13px; color: var(--muted); }
.home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 20px; }
.home-card { background: var(--surface); border-radius: var(--r-lg); border: 1.5px solid var(--border); padding: 18px 16px; cursor: pointer; transition: transform 0.12s, border-color 0.12s; display: flex; flex-direction: column; gap: 8px; min-height: 110px; position: relative; overflow: hidden; }
.home-card:active { transform: scale(0.97); border-color: var(--pine); }
.home-card.festival-card { border-color: var(--gold); background: linear-gradient(135deg, var(--surface) 60%, var(--gold-lt)); }
.home-card.disabled { opacity: 0.5; }
.home-card-icon { font-size: 26px; line-height: 1; }
.home-card-label { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.home-card-sub { font-size: 11px; color: var(--muted); line-height: 1.3; margin-top: auto; }
.home-card-arrow { position: absolute; bottom: 14px; right: 14px; color: var(--dim); font-size: 16px; }

#view-browse { display: none; }
#view-browse.active { display: block; }
.list-section-hd { padding: 16px 16px 10px; }
.list-section-title { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
.list-section-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.list-card { background: var(--surface); border-radius: var(--r-lg); margin: 8px 12px; border: 1px solid var(--border); overflow: hidden; }
.list-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; gap: 12px; }
.list-row:last-child { border-bottom: none; }
.list-row:active { background: var(--gold-lt); }
.list-row-left { flex: 1; min-width: 0; }
.list-row-name { font-size: 16px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.list-row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.list-row-price { font-size: 12px; color: var(--muted); }
.list-row-arrow { color: var(--dim); font-size: 20px; }
.park-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.park-tile { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-lg); padding: 16px; cursor: pointer; transition: all 0.12s; display: flex; flex-direction: column; gap: 4px; }
.park-tile:active { transform: scale(0.97); border-color: var(--pine); }
.park-tile-abbr { font-size: 22px; font-weight: 700; color: var(--pine); letter-spacing: -0.02em; font-family: var(--serif); margin-bottom: 4px; }
.park-tile-name { font-size: 14px; font-weight: 600; color: var(--ink); }
.park-tile-count { font-size: 11px; color: var(--muted); }

#view-menu { display: none; }
#view-menu.active { display: block; }
#menu-sticky-stack {
  position: sticky;
  top: var(--menu-sticky-top, 0);
  z-index: 40;
  margin: 0 var(--plane-margin);
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 26px rgba(0,0,0,0.20), 0 2px 6px rgba(0,0,0,0.10);
  overflow: hidden;
}
.menu-rest-header {
  background: var(--surface);
  padding: 9px 16px 7px;
}
.menu-rest-name-row { display: flex; align-items: flex-start; gap: 8px; }
.menu-rest-name { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; line-height: 1.15; flex: 1; }
.info-btn { background: var(--surface); border: 1.5px solid var(--border-md); border-radius: 50%; width: 23px; height: 23px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 0; color: var(--muted); font-size: 11px; font-weight: 700; font-family: var(--serif); font-style: italic; transition: all 0.12s; }
.info-btn:active { background: var(--gold-lt); border-color: var(--gold); color: var(--forest); }
.menu-rest-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

.period-tabs { display: flex; gap: 6px; padding: 6px 12px; overflow-x: auto; scrollbar-width: none; background: var(--surface); border-top: 1px solid var(--border); }
.period-tabs::-webkit-scrollbar { display: none; }
.period-tab { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 500; padding: 3px 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.15s; }

/* ── Park Guide experiment: sticky restaurant card matches the search
   bar's muted sage-green (not the solid forest header) with light text.
   Scoped to this theme only — testing whether a dark card reads more
   clearly than a near-white one barely separating from the page. ── */
[data-theme="parkguide"] #glass-plane,
[data-theme="parkguide"] #results-plane,
[data-theme="parkguide"] #filter-plane,
[data-theme="parkguide"] #maps-card,
[data-theme="parkguide"] .results-section-hd {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
[data-theme="parkguide"] #menu-sticky-stack { background: #5A4632; }
[data-theme="parkguide"] .menu-rest-header { background: transparent; }
[data-theme="parkguide"] .menu-rest-name { color: #F5E6C8; }
[data-theme="parkguide"] .menu-rest-meta { color: #D9C7A0; }
[data-theme="parkguide"] .info-btn { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); color: #F5E6C8; }
[data-theme="parkguide"] .period-tabs { background: transparent; border-top: 1px solid rgba(255,255,255,0.18); }
[data-theme="parkguide"] .period-tab { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); color: #D9C7A0; }
[data-theme="parkguide"] .period-tab.active { background: #F5E6C8; border-color: #F5E6C8; color: #5A4632; }

/* ── Mid-Century: pale yellow sticky card — a lighter wash of the
   theme's existing amber accent (--pine), keeping it native to the
   palette rather than introducing an unrelated hue. Dark ink text. ── */
[data-theme="midcentury"] #menu-sticky-stack { background: #F5E3B8; }
[data-theme="midcentury"] .menu-rest-header { background: transparent; }
[data-theme="midcentury"] .menu-rest-name { color: var(--ink); }
[data-theme="midcentury"] .menu-rest-meta { color: #5A4F3D; }
[data-theme="midcentury"] .info-btn { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.18); color: var(--ink); }
[data-theme="midcentury"] .period-tabs { background: transparent; border-top: 1px solid rgba(0,0,0,0.1); }
[data-theme="midcentury"] .period-tab { background: rgba(255,255,255,0.5); border-color: rgba(0,0,0,0.12); color: #5A4F3D; }

.period-tab.active { background: var(--forest); border-color: var(--forest); color: #fff; font-weight: 600; }

.menu-group { margin: 8px 12px 2px; background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--border); overflow: hidden; }
.menu-group-hd { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; padding: 10px 16px 7px; background: var(--pine); }
/* Mid-Century: olive-sage green sampled from the reference moodboard
   (avocado-kitchen green), used only for menu section headers so they
   read distinctly from the amber active-states elsewhere in this theme. */
[data-theme="midcentury"] .menu-group-hd { background: #717544; }
.menu-cat-hd { font-family: var(--serif); font-size: 14px; font-style: italic; color: var(--muted); padding: 8px 16px 4px; border-bottom: 1px solid var(--border); background: var(--surface); }
.menu-item { padding: 10px 16px; border-bottom: 1px solid var(--border); }
.menu-item:last-child { border-bottom: none; }
.menu-item.highlighted { background: var(--gold-lt); border-left: 3px solid var(--gold); }
.menu-item-name { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 2px; display: flex; align-items: flex-start; gap: 6px; }
.menu-item-name-text { flex: 1; }
.festival-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--forest); background: var(--gold-lt); border: 1px solid var(--gold); border-radius: 4px; padding: 1px 5px; flex-shrink: 0; margin-top: 2px; }
.menu-item-desc { font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: 3px; }
.menu-item-footer { display: flex; align-items: center; gap: 8px; }
.menu-item-price { font-size: 13px; font-weight: 600; color: var(--forest); }
.menu-item-changed { font-size: 10px; color: var(--muted); text-decoration: line-through; }
.menu-empty { text-align: center; padding: 48px 32px; color: var(--muted); font-size: 15px; }

.af-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--pine); color: var(--pine); font-size: 9px; font-weight: 700; flex-shrink: 0; cursor: pointer; line-height: 1; background: none; }

#results-plane {
  display: none;
  position: fixed;
  left: var(--plane-margin); right: var(--plane-margin);
  z-index: 95;
  background: var(--plane-glass);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border-radius: var(--r-xl);
  box-shadow: 0 10px 36px rgba(0,0,0,0.22), 0 3px 10px rgba(0,0,0,0.10);
  overflow: hidden;
  flex-direction: column;
  transition: bottom 0.28s cubic-bezier(0.32,0.72,0,1);
}
#results-plane.visible { display: flex; }
#results-meta { flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
#results-left { display: flex; align-items: center; gap: 8px; }
#results-back-btn { display: none; background: none; border: none; color: var(--forest); font-size: 20px; font-weight: 700; line-height: 1; padding: 0 2px 0 0; cursor: pointer; }
#results-back-btn.visible { display: inline-block; }
#results-count { font-size: 12px; color: var(--muted); font-weight: 500; }
#results-sort-label { font-size: 11px; color: var(--pine); font-weight: 600; }
#results-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.results-top-hd {
  font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: #fff; padding: 9px 16px;
  background: var(--forest);
  position: sticky; top: 0; z-index: 3;
}
.results-sub-hd {
  font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--forest); padding: 7px 16px 6px;
  background: var(--surface);
  position: sticky; top: var(--results-top-hd-h, 34px); z-index: 2;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 var(--border);
}
.results-section-hd { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--forest); padding: 12px 16px 6px; background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }

.result-type { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; background: rgba(255,255,255,0.5); transition: background 0.1s; }
.result-type:active { background: var(--gold-lt); }
.result-type-name { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-type-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.result-type-count { font-size: 13px; color: var(--muted); font-weight: 500; }
.result-type-arrow { color: var(--dim); font-size: 18px; }

.result-rest { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; background: rgba(255,255,255,0.5); transition: background 0.1s; }
.result-rest:active { background: var(--gold-lt); }
.result-rest-body { flex: 1; min-width: 0; }
.result-rest-name { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-rest-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.result-rest-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.result-rest-dist { font-size: 11px; color: var(--pine); font-weight: 600; }
.result-rest-arrow { color: var(--dim); font-size: 18px; }

.result-item { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; background: rgba(255,255,255,0.5); transition: background 0.1s; }
.result-item:active { background: var(--gold-lt); }
.result-item-name { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
.result-item-name em { font-style: normal; color: var(--gold); font-weight: 700; }
.result-item-rest { font-size: 13px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-item-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.result-item-loc { font-size: 11px; color: var(--dim); }
.result-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.result-item-dist { font-size: 11px; color: var(--pine); font-weight: 600; }
.result-item-price { font-size: 13px; color: var(--forest); font-weight: 600; }

.empty-state { text-align: center; padding: 60px 32px; }
.empty-state-title { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }

.filter-chips { display: flex; flex-wrap: wrap; gap: 5px; padding-top: 2px; }

<script>
'use strict';

// ── STATE ──────────────────────────────────────────────
let RESTAURANTS = [], MENUS = [], REST_MAP = {}, MENU_MAP = {};
let userLat = null, userLng = null;
let proximityActive = false;
let locationPermission = 'unknown';
let currentView = 'home';
let browseStack = [];
let currentRestId = null, currentPeriod = null, highlightItem = null;
let filterExpanded = false;
// Search session state — three states:
//   'closed'   — no session. No results, no filter pane. Default / after clear.
//   'browsing' — results unrolled, filter peek showing.
//   'tucked'   — a result was selected; menu shows behind, results/filter
//                rolled up, but search term + last results are preserved so
//                tapping the bar pops right back to 'browsing'.
let searchSessionState = 'closed';
let resultsActive = false; // true for 'browsing' or 'tucked' — drives layoutPlanes

const filters = {
  location: new Set(), food: new Set(), meal: new Set(),
  style: new Set(), price: new Set(), dietary: new Set(),
};

const PERIOD_ORDER = ['Breakfast','Brunch','Lunch','Dinner','All Day','Lounge','Snack'];

const LOC_TAGS = [
  { tag: 'magic-kingdom',     label: 'Magic Kingdom',     abbr: 'MK' },
  { tag: 'epcot',             label: 'EPCOT',             abbr: 'EC' },
  { tag: 'hollywood-studios', label: 'Hollywood Studios', abbr: 'HS' },
  { tag: 'animal-kingdom',    label: 'Animal Kingdom',    abbr: 'AK' },
  { tag: 'disney-springs',    label: 'Disney Springs',    abbr: 'DS' },
  { tag: 'disney-resort',     label: 'Resorts',           abbr: 'RES' },
  { tag: 'water-park',        label: 'Water Parks',       abbr: 'WP' },
];
const FOOD_FILTERS = [
  {key:'entrees',label:'Entrées'},{key:'appetizers',label:'Appetizers'},
  {key:'sandwiches-burgers',label:'Sandwiches & Burgers'},{key:'pizza-pasta',label:'Pizza & Pasta'},
  {key:'sushi',label:'Sushi & Poke'},{key:'seafood',label:'Seafood'},
  {key:'breakfast',label:'Breakfast'},{key:'soups-salads',label:'Soups & Salads'},
  {key:'sides',label:'Sides'},{key:'desserts',label:'Desserts & Bakery'},
  {key:'snacks',label:'Snacks'},{key:'beer-cider',label:'Beer & Cider'},
  {key:'wine',label:'Wine'},{key:'spirits-cocktails',label:'Cocktails & Spirits'},
  {key:'non-alcoholic',label:'Non-Alcoholic'},
];
const STYLE_FILTERS = [
  {key:'Signature Dining',label:'Signature'},{key:'Table Service',label:'Table Service'},
  {key:'Quick Service',label:'Quick Service'},{key:'Bar / Lounge',label:'Bar & Lounge'},
  {key:'Kiosk',label:'Kiosk / Cart'},{key:'character-dining',label:'Character Dining'},
];
const PRICE_FILTERS = [
  {key:'1',label:'$ Under $15'},{key:'2',label:'$$ $15–$34'},
  {key:'3',label:'$$$ $35–$59'},{key:'4',label:'$$$$ $60+'},
];
// 'alcoholic' removed — redundant with Beer/Wine/Cocktails food-type filters.
const DIETARY_FILTERS = [
  {key:'kids',label:'Kids menu'},{key:'allergy-friendly',label:'Allergy-friendly'},
];

// ── UTILS ──────────────────────────────────────────────
const esc = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function dist(la1,lo1,la2,lo2){const R=3958.8,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180,a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
const fmtDist = m => m < 0.1 ? Math.round(m*5280)+' ft' : m.toFixed(1)+' mi';
function highlightMatch(text,q){if(!text||!q)return esc(text);const i=text.toLowerCase().indexOf(q.toLowerCase());if(i===-1)return esc(text);return esc(text.slice(0,i))+'<em>'+esc(text.slice(i,i+q.length))+'</em>'+esc(text.slice(i+q.length));}
const filterCount = () => Object.values(filters).reduce((n,s)=>n+s.size,0);
function locationLabel(r){if(!r)return '';if(r.park){const l=LOC_TAGS.find(x=>r.tags?.includes(x.tag));return[l?.abbr||r.park,r.area].filter(Boolean).join(' · ');}if(r.resort)return r.resort;return r.area||'';}
// Fixed top-level bucket order for non-proximity grouping.
const TOP_BUCKET_ORDER = ['Parks', 'Disney Springs', 'Resorts', 'Other'];

// The four main theme parks — these group by their real `area` field
// (lands like Fantasyland, World Showcase, etc). Water Parks are handled
// separately above since their `area` field doesn't contain usable data.
// ── TYPE SEARCH ──────────────────────────────────────────
// As you type, recognized dining-type phrases and cuisine names surface
// as tappable suggestions above the normal results — reuses the existing
// search bar, no separate UI. Prefix match (not just exact), evaluated
// fresh on every keystroke: "bar" alone already resolves uniquely, "s"
// alone matches several groups at once (shown as multiple candidates,
// capped per category), and typing further narrows or clears them
// naturally with no separate threshold state to track.
const TYPE_SEARCH_TERMS = [
  { terms:['character dining','character meal','character meals'], test:r=>r.is_character_dining, label:'Character Dining' },
  { terms:['quick service'],      test:r=>r.experience_type==='Quick Service', label:'Quick Service' },
  { terms:['table service'],      test:r=>r.experience_type==='Table Service', label:'Table Service' },
  { terms:['signature dining','signature'], test:r=>r.experience_type==='Signature Dining', label:'Signature Dining' },
  { terms:['kiosk','cart'],       test:r=>r.experience_type==='Kiosk', label:'Kiosk / Cart' },
  { terms:['buffet','all you can eat','all-you-care-to-eat'], test:r=>r.tags?.includes('buffet'), label:'Buffet' },
  { terms:['bar / lounge','bar and lounge','lounge','bar'], test:r=>r.experience_type==='Bar / Lounge', label:'Bar & Lounge' },
  { terms:['snack'],              test:r=>r.experience_type==='Snack', label:'Snack' },
  { terms:['dinner show'],        test:r=>r.experience_type==='Dinner Show', label:'Dinner Show' },
  { terms:['dining event'],       test:r=>r.experience_type==='Dining Event', label:'Dining Event' },
];

// Built once from real data at init time — avoids drifting out of sync
// with whatever cuisine_tags values actually exist in the current dataset.
let CUISINE_TAG_SET = new Set();
// restaurant-count cache per group label, used for sorting candidates —
// built alongside the tag set so it's ready before any search happens.
let TYPE_SEARCH_COUNTS = {};

function buildCuisineTagSet(){
  CUISINE_TAG_SET = new Set();
  for(const r of RESTAURANTS){
    for(const tag of (r.cuisine_tags||[])) CUISINE_TAG_SET.add(tag);
  }
  TYPE_SEARCH_COUNTS = {};
  for(const entry of TYPE_SEARCH_TERMS){
    TYPE_SEARCH_COUNTS[entry.label] = RESTAURANTS.filter(entry.test).length;
  }
  for(const tag of CUISINE_TAG_SET){
    const label = tag.charAt(0).toUpperCase()+tag.slice(1);
    TYPE_SEARCH_COUNTS[label] = RESTAURANTS.filter(r=>r.cuisine_tags?.includes(tag)).length;
  }
}

const MIN_TYPE_SEARCH_CHARS = 2;   // don't show anything before this many characters typed
const MAX_CANDIDATES_PER_CATEGORY = 3;

// Returns { diningType: [...candidates], cuisine: [...candidates] },
// each entry {test, label, count}, each list capped at 3 and sorted by
// restaurant count descending. Either or both lists may be empty.
function detectTypeCandidates(qLow){
  const empty = { diningType: [], cuisine: [] };
  if(!qLow || qLow.length < MIN_TYPE_SEARCH_CHARS) return empty;

  const diningType = [];
  for(const entry of TYPE_SEARCH_TERMS){
    if(entry.terms.some(t=>t.startsWith(qLow))){
      diningType.push({ test:entry.test, label:entry.label, count:TYPE_SEARCH_COUNTS[entry.label]||0 });
    }
  }
  const cuisine = [];
  for(const tag of CUISINE_TAG_SET){
    if(tag.startsWith(qLow)){
      const label = tag.charAt(0).toUpperCase()+tag.slice(1);
      cuisine.push({ test:r=>r.cuisine_tags?.includes(tag), label, count:TYPE_SEARCH_COUNTS[label]||0 });
    }
  }
  diningType.sort((a,b)=>b.count-a.count);
  cuisine.sort((a,b)=>b.count-a.count);
  return {
    diningType: diningType.slice(0, MAX_CANDIDATES_PER_CATEGORY),
    cuisine: cuisine.slice(0, MAX_CANDIDATES_PER_CATEGORY),
  };
}

const PARK_ORDER = [
  { tag:'magic-kingdom', label:'Magic Kingdom' },
  { tag:'epcot', label:'EPCOT' },
  { tag:'hollywood-studios', label:'Hollywood Studios' },
  { tag:'animal-kingdom', label:'Animal Kingdom' },
];

// Returns { top, sub } — top is one of TOP_BUCKET_ORDER, sub is the
// second-level grouping (area name, or resort name).
function twoTierGroupKey(r){
  if(!r) return { top:'Other', sub:'Other' };
  const tags = r.tags || [];

  if(tags.includes('disney-springs')){
    return { top:'Disney Springs', sub: r.area || 'Other' };
  }
  if(tags.includes('disney-resort')){
    return { top:'Resorts', sub: r.resort || r.restaurant || 'Other' };
  }
  if(tags.includes('water-park')){
    // Disney's API reports `area` for water parks as the surrounding
    // RESORT ZONE (e.g. "Disney Springs Resort Area"), not an actual
    // in-park land — there's no meaningful sub-area data, so group by
    // the water park itself (Blizzard Beach vs Typhoon Lagoon) instead.
    const wpName = (r.park || '').replace(/^Disney'?s\s+/i, '').replace(/\s+Water Park$/i, '').trim();
    return { top:'Water Parks', sub: wpName || 'Other' };
  }
  const park = PARK_ORDER.find(p => tags.includes(p.tag));
  if(park){
    return { top: park.label, sub: r.area || 'Other' };
  }
  return { top:'Other', sub: r.area || r.resort || 'Other' };
}

// Sort key for ordering top-level buckets: parks in their canonical order,
// then Disney Springs, then Resorts, then anything uncategorized last.
function topBucketSortIndex(top){
  const parkIdx = PARK_ORDER.findIndex(p => p.label === top);
  if(parkIdx !== -1) return parkIdx; // 0..3, the four main parks in canonical order
  if(top === 'Water Parks') return 50;
  if(top === 'Disney Springs') return 100;
  if(top === 'Resorts') return 200;
  return 999; // Other
}

function defaultPeriod(available){const h = new Date().getHours();const preferred = h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : 'Dinner';return available.includes(preferred) ? preferred : available[0];}

// ── THEME SWITCHER ─────────────────────────────────────
function setupThemeSwitcher(){
  document.querySelectorAll('#theme-switcher button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.body.setAttribute('data-theme',btn.dataset.theme);
      document.querySelectorAll('#theme-switcher button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      // Font changes between themes (Bitter, Poppins, Inter) render the
      // glass header at slightly different heights — every sticky offset
      // that depends on --menu-sticky-top goes stale until recalculated.
      // Wait a frame for the new font/styles to actually apply first.
      requestAnimationFrame(()=>requestAnimationFrame(layoutPlanes));
    });
  });
}

// ── LAYOUT MATH ────────────────────────────────────────
function layoutPlanes(){
  const plane = document.getElementById('glass-plane');
  const planeRect = plane.getBoundingClientRect();
  const margin = 8, gap = 8;

  document.getElementById('main').style.paddingTop = (planeRect.bottom + gap) + 'px';
  document.documentElement.style.setProperty('--menu-sticky-top', (planeRect.bottom + gap) + 'px');

  const resultsPlane = document.getElementById('results-plane');
  resultsPlane.style.top = (planeRect.bottom + gap) + 'px';

  const filterPlane = document.getElementById('filter-plane');
  let bottomGap = margin;
  if(resultsActive){
    const filterH = filterPlane.getBoundingClientRect().height;
    bottomGap = filterH + margin + 6;
  }
  resultsPlane.style.bottom = bottomGap + 'px';
}
window.addEventListener('resize', layoutPlanes);

// ── DATA LOAD ──────────────────────────────────────────
async function loadData(){
  try {
    const [rData,mData] = await Promise.all([
      fetch('restaurant_data_normalized.json').then(r=>r.json()),
      fetch('menu_data_normalized.json').then(r=>r.json()),
    ]);
    RESTAURANTS = rData.filter(r=>r.show_in_app);
    MENUS = mData;
    REST_MAP = Object.fromEntries(RESTAURANTS.map(r=>[r.restaurant_id,r]));
    MENU_MAP = {};
    for(const item of MENUS){
      if(!MENU_MAP[item.restaurant_id]) MENU_MAP[item.restaurant_id]=[];
      MENU_MAP[item.restaurant_id].push(item);
    }
    init();
  } catch(e){
    document.getElementById('loading-sub').textContent='Could not load data. Are files in the same folder?';
    console.error(e);
  }
}

// ── INIT ───────────────────────────────────────────────
function init(){
  buildCuisineTagSet();
  checkLocationPermission();
  buildHomeCards();
  buildFilterPanel();
  setupSearch();
  setupProximityBtn();
  setupFilterSwipe();
  setupMapsCard();
  setupAllergyTooltip();
  setupNavigation();
  setupThemeSwitcher();
  document.getElementById('results-plane').classList.remove('visible');
  document.getElementById('filter-plane').classList.remove('visible');
  searchSessionState = 'closed';
  resultsActive = false;
  showView('home');
  layoutPlanes();
  dismissLoading();
}
function dismissLoading(){const el=document.getElementById('loading');el.classList.add('done');setTimeout(()=>el.remove(),500);}

// ── LOCATION ───────────────────────────────────────────
function checkLocationPermission(){
  if(!navigator.geolocation){locationPermission='denied';updateProximityBtn();return;}
  if(navigator.permissions){
    navigator.permissions.query({name:'geolocation'}).then(r=>{
      locationPermission=r.state==='granted'?'granted':r.state==='denied'?'denied':'unknown';
      if(locationPermission==='granted') fetchLocation();
      updateProximityBtn();
    });
  }
}
function fetchLocation(cb){
  navigator.geolocation.getCurrentPosition(
    pos=>{userLat=pos.coords.latitude;userLng=pos.coords.longitude;locationPermission='granted';updateProximityBtn();if(cb)cb(true);if(proximityActive)triggerSearch();},
    ()=>{locationPermission='denied';proximityActive=false;updateProximityBtn();if(cb)cb(false);},
    {enableHighAccuracy:true,timeout:8000}
  );
}
function updateProximityBtn(){
  const btn=document.getElementById('proximity-btn');
  btn.classList.remove('active','no-permission');
  if(locationPermission==='denied'&&!userLat) btn.classList.add('no-permission');
  else if(proximityActive) btn.classList.add('active');
}
function setupProximityBtn(){
  document.getElementById('proximity-btn').addEventListener('click',()=>{
    if(locationPermission==='denied'&&!userLat) return;
    if(userLat){proximityActive=!proximityActive;updateProximityBtn();triggerSearch();}
    else fetchLocation(ok=>{if(ok){proximityActive=true;triggerSearch();}});
  });
}

// ── NAVIGATION ─────────────────────────────────────────
function setupNavigation(){
  document.getElementById('home-btn').addEventListener('click',goHome);
  document.getElementById('breadcrumb-label').addEventListener('click',()=>{
    if(currentView==='menu'){
      // Returning from a menu page: go back to exactly the restaurant list
      // we came from. browseStack still holds [park, area] (or
      // [resort-root, resort]) from when we drilled into the restaurant —
      // don't pop it, just re-render that same restaurant list rather than
      // climbing an extra level up.
      const top = browseStack[browseStack.length-1];
      if(top?.type==='area'){
        showRestaurantList(browseStack[browseStack.length-2]?.value, top.value);
      } else if(top?.type==='park'){
        showAreaList(top.value, top.label);
      } else if(top?.type==='resort'){
        showRestaurantListByResort(top.value);
      } else if(top?.type==='resort-root'){
        showResortList();
      } else {
        goHome();
      }
      return;
    }
    // Otherwise we're already inside the browse hierarchy (on an area,
    // resort, or restaurant list) — pop one level to climb up, as before.
    if(browseStack.length>1){browseStack.pop();const t=browseStack[browseStack.length-1];
      if(t.type==='park') showAreaList(t.value,t.label);
      else if(t.type==='area') showRestaurantList(browseStack[browseStack.length-2]?.value,t.value);
      else if(t.type==='resort-root') showResortList();
      else if(t.type==='resort') showRestaurantListByResort(t.value);
    } else goHome();
  });
}
function goHome(){
  browseStack=[];currentRestId=null;highlightItem=null;currentPeriod=null;
  closeSearchSession();
  setNav('home');showView('home');
}
function setNav(view,breadLabel,titleText){
  const sep=document.getElementById('breadcrumb-sep');
  const lbl=document.getElementById('breadcrumb-label');
  const title=document.getElementById('header-title');
  if(view==='home'){sep.style.display='none';lbl.style.display='none';title.textContent='';}
  else{sep.style.display=breadLabel?'inline':'none';lbl.style.display=breadLabel?'inline':'none';lbl.textContent=breadLabel||'';title.textContent=titleText||'';}
}
function showView(name){
  ['home','browse','menu'].forEach(v=>document.getElementById('view-'+v).classList.remove('active'));
  if(name!=='search'){const el=document.getElementById('view-'+name);if(el){el.classList.add('active');window.scrollTo(0,0);}}
  currentView=name;
  requestAnimationFrame(layoutPlanes);
}

// ── HOME CARDS ─────────────────────────────────────────
function buildHomeCards(){
  const festCount=MENUS.filter(m=>m.is_festival_item&&m.show_in_menu).length;
  const priceChanges=MENUS.filter(m=>m.show_in_menu&&m.price_changed).length;

  const cards=[
    {icon:'⊕',label:locationPermission==='denied'&&!userLat?'Pick a Park':'Near Me',
     sub:locationPermission==='denied'&&!userLat?'Browse by location':'Sort by your distance',
     action:()=>{
       if(locationPermission==='denied'&&!userLat){showBrowseHome();}
       else if(userLat){proximityActive=true;updateProximityBtn();focusSearch('');}
       else fetchLocation(ok=>{if(ok){proximityActive=true;focusSearch('');}else showBrowseHome();});
     }},
    {icon:'🗺️',label:'Browse',sub:'Parks, resorts & Disney Springs',action:()=>showBrowseHome()},
    festCount>0?{icon:'🎪',label:'Festival',sub:`${festCount} special items`,action:()=>showFestivalItems(),festival:true}:null,
    {icon:'🔄',label:'Price Changes',sub:priceChanges>0?`${priceChanges} items updated`:'No recent changes',
     action:()=>showPriceChanges(),disabled:priceChanges===0},
  ].filter(Boolean);

  const container=document.getElementById('home-cards');
  container.innerHTML=cards.map((c,i)=>`
    <div class="home-card${c.festival?' festival-card':''}${c.disabled?' disabled':''}" data-idx="${i}">
      <div class="home-card-icon">${c.icon}</div>
      <div class="home-card-label">${esc(c.label)}</div>
      <div class="home-card-sub">${esc(c.sub)}</div>
      <div class="home-card-arrow">›</div>
    </div>`).join('');
  container.querySelectorAll('.home-card').forEach(el=>{
    el.addEventListener('click',()=>{const c=cards[+el.dataset.idx];if(!c.disabled)c.action();});
  });
}

// ── BROWSE ─────────────────────────────────────────────
function showBrowseHome(){
  browseStack=[];
  document.getElementById('browse-title').textContent='Explore';
  document.getElementById('browse-sub').textContent='Choose a location';
  const grid=LOC_TAGS.map(loc=>{
    const count=RESTAURANTS.filter(r=>r.tags?.includes(loc.tag)).length;
    if(!count)return '';
    return `<div class="park-tile" data-tag="${esc(loc.tag)}" data-label="${esc(loc.label)}">
      <div class="park-tile-abbr">${esc(loc.abbr)}</div>
      <div class="park-tile-name">${esc(loc.label)}</div>
      <div class="park-tile-count">${count} restaurants</div>
    </div>`;
  }).join('');
  document.getElementById('browse-list').innerHTML=`<div class="park-grid">${grid}</div>`;
  document.querySelectorAll('.park-tile').forEach(el=>{
    el.addEventListener('click',()=>{
      // Resorts skip the generic area-grouping path — Disney's `area` field
      // for resort restaurants is an administrative geofence (e.g. "Magic
      // Kingdom Resort Area"), not a real place, and forces an extra click
      // through a meaningless bucket before reaching an actual resort. Go
      // straight to a flat alphabetical list of the 28 real resort names.
      if(el.dataset.tag==='disney-resort') showResortList();
      else showAreaList(el.dataset.tag,el.dataset.label);
    });
  });
  setNav('browse','','');showView('browse');
}

function showAreaList(locTag,locLabel){
  browseStack=[{type:'park',value:locTag,label:locLabel}];
  const rests=RESTAURANTS.filter(r=>r.tags?.includes(locTag));
  const areas=[...new Set(rests.map(r=>r.area).filter(Boolean))].sort();
  document.getElementById('browse-title').textContent=locLabel;
  document.getElementById('browse-sub').textContent=`${rests.length} restaurants`;
  if(areas.length<=1){showRestaurantList(locTag,areas[0]||'');return;}
  const rows=areas.map(area=>{
    const n=rests.filter(r=>r.area===area).length;
    return `<div class="list-row" data-area="${esc(area)}">
      <div class="list-row-left"><div class="list-row-name">${esc(area)}</div><div class="list-row-sub">${n} restaurant${n!==1?'s':''}</div></div>
      <div class="list-row-right"><span class="list-row-arrow">›</span></div>
    </div>`;
  }).join('');
  document.getElementById('browse-list').innerHTML=`<div class="list-card">${rows}</div>`;
  document.querySelectorAll('.list-row[data-area]').forEach(el=>{
    el.addEventListener('click',()=>showRestaurantList(locTag,el.dataset.area));
  });
  setNav('browse','Explore',locLabel);showView('browse');
}

function showResortList(){
  browseStack=[{type:'resort-root',value:'disney-resort',label:'Resorts'}];
  const rests=RESTAURANTS.filter(r=>r.tags?.includes('disney-resort'));
  const resorts=[...new Set(rests.map(r=>r.resort).filter(Boolean))].sort();
  document.getElementById('browse-title').textContent='Resorts';
  document.getElementById('browse-sub').textContent=`${resorts.length} resorts`;
  const rows=resorts.map(resort=>{
    const n=rests.filter(r=>r.resort===resort).length;
    return `<div class="list-row" data-resort="${esc(resort)}">
      <div class="list-row-left"><div class="list-row-name">${esc(resort)}</div><div class="list-row-sub">${n} restaurant${n!==1?'s':''}</div></div>
      <div class="list-row-right"><span class="list-row-arrow">›</span></div>
    </div>`;
  }).join('');
  document.getElementById('browse-list').innerHTML=`<div class="list-card">${rows}</div>`;
  document.querySelectorAll('.list-row[data-resort]').forEach(el=>{
    el.addEventListener('click',()=>showRestaurantListByResort(el.dataset.resort));
  });
  setNav('browse','Explore','Resorts');
  showView('browse');
}

function showRestaurantListByResort(resortName){
  if(!browseStack.length) browseStack=[{type:'resort-root',value:'disney-resort',label:'Resorts'}];
  // Same duplicate-push guard as showRestaurantList (area version) — without
  // it, re-calling this for the SAME resort (the breadcrumb menu-return path
  // does this deliberately, without popping) stacks duplicate resort entries
  // on every round-trip and corrupts the parent-lookup math. See the area
  // version's comment for the full failure mode this caused previously.
  const top = browseStack[browseStack.length-1];
  if(!(top?.type==='resort' && top.value===resortName)){
    browseStack.push({type:'resort',value:resortName,label:resortName});
  }
  const rests=RESTAURANTS.filter(r=>r.tags?.includes('disney-resort')&&r.resort===resortName).sort((a,b)=>a.restaurant.localeCompare(b.restaurant));
  document.getElementById('browse-title').textContent=resortName;
  document.getElementById('browse-sub').textContent=`${rests.length} restaurants`;
  const rows=rests.map(r=>`
    <div class="list-row" data-rid="${esc(r.restaurant_id)}">
      <div class="list-row-left">
        <div class="list-row-name">${esc(r.restaurant)}</div>
        <div class="list-row-sub">${esc(r.experience_type||'')}${r.primary_cuisine&&r.experience_type?' · ':''}${esc(r.primary_cuisine||'')}</div>
      </div>
      <div class="list-row-right">
        ${r.price_tier?`<span class="list-row-price">${'$'.repeat(r.price_tier)}</span>`:''}
        <span class="list-row-arrow">›</span>
      </div>
    </div>`).join('');
  document.getElementById('browse-list').innerHTML=`<div class="list-card">${rows}</div>`;
  document.querySelectorAll('.list-row[data-rid]').forEach(el=>{
    el.addEventListener('click',()=>{currentRestId=el.dataset.rid;showMenu(el.dataset.rid,null,null);});
  });
  setNav('browse',browseStack[browseStack.length-2]?.label||'Resorts',resortName);
  showView('browse');
}

function showRestaurantList(locTag,area){
  if(!browseStack.length) browseStack=[{type:'park',value:locTag,label:LOC_TAGS.find(l=>l.tag===locTag)?.label||''}];
  // Only push a new area frame if we're not already sitting on this exact
  // area. Without this guard, re-calling showRestaurantList for the SAME
  // area (as the breadcrumb's menu-return path does, deliberately without
  // popping) stacks duplicate area entries on every round-trip. Two such
  // duplicates corrupt the parent-lookup math (browseStack[length-2] ends
  // up pointing at another area frame instead of the park frame), which is
  // what caused "0 restaurants" after two breadcrumb clicks.
  const top = browseStack[browseStack.length-1];
  if(!(top?.type==='area' && top.value===area)){
    browseStack.push({type:'area',value:area,label:area});
  }
  const rests=RESTAURANTS.filter(r=>r.tags?.includes(locTag)&&r.area===area).sort((a,b)=>a.restaurant.localeCompare(b.restaurant));
  document.getElementById('browse-title').textContent=area;
  const abbr=LOC_TAGS.find(l=>l.tag===locTag)?.abbr||locTag;
  document.getElementById('browse-sub').textContent=`${abbr} · ${rests.length} restaurants`;
  const rows=rests.map(r=>`
    <div class="list-row" data-rid="${esc(r.restaurant_id)}">
      <div class="list-row-left">
        <div class="list-row-name">${esc(r.restaurant)}</div>
        <div class="list-row-sub">${esc(r.experience_type||'')}${r.primary_cuisine&&r.experience_type?' · ':''}${esc(r.primary_cuisine||'')}</div>
      </div>
      <div class="list-row-right">
        ${r.price_tier?`<span class="list-row-price">${'$'.repeat(r.price_tier)}</span>`:''}
        <span class="list-row-arrow">›</span>
      </div>
    </div>`).join('');
  document.getElementById('browse-list').innerHTML=`<div class="list-card">${rows}</div>`;
  document.querySelectorAll('.list-row[data-rid]').forEach(el=>{
    el.addEventListener('click',()=>{currentRestId=el.dataset.rid;showMenu(el.dataset.rid,null,null);});
  });
  setNav('browse',browseStack[browseStack.length-2]?.label||'Explore',area);
  showView('browse');
}

// ── MENU VIEW ──────────────────────────────────────────
function showMenu(restaurantId,scrollToItem,period){
  const r=REST_MAP[restaurantId];if(!r)return;
  currentRestId=restaurantId;highlightItem=scrollToItem;

  document.getElementById('menu-rest-name').textContent=r.restaurant;
  const metaParts=[locationLabel(r)];
  if(r.price_tier) metaParts.push('$'.repeat(r.price_tier));
  if(r.experience_type) metaParts.push(r.experience_type);
  document.getElementById('menu-rest-meta').textContent=metaParts.join(' · ');

  const infoBtn=document.getElementById('menu-info-btn');
  if(r.lat&&r.lng){infoBtn.style.display='flex';infoBtn.onclick=()=>showMapsCard(r);}
  else infoBtn.style.display='none';

  const allItems=(MENU_MAP[restaurantId]||[]).filter(i=>i.show_in_menu);

  // When jumping to a specific item from search, the target item's OWN
  // dining_period takes priority over any explicit period arg or the
  // time-of-day default — otherwise a Dinner-only item gets silently
  // filtered out if you search for it at lunchtime and nothing highlights.
  if(scrollToItem && !period){
    const targetItem = allItems.find(i => i.item?.toLowerCase() === scrollToItem.toLowerCase());
    if(targetItem) period = targetItem.dining_period || null;
  }

  const rawPeriods=new Set(allItems.map(i=>i.dining_period||'All Day'));
  const hasReal=['Breakfast','Brunch','Lunch','Dinner'].some(p=>rawPeriods.has(p));
  const periods=PERIOD_ORDER.filter(p=>{
    if(p==='All Day') return rawPeriods.has('All Day')&&!hasReal;
    return rawPeriods.has(p);
  });
  const showPeriods = periods.length > 0 ? periods : [...rawPeriods];

  if(period&&showPeriods.includes(period)) currentPeriod=period;
  else currentPeriod=defaultPeriod(showPeriods);

  const tabsWrap=document.getElementById('period-tabs-wrap');
  if(showPeriods.length>1){
    tabsWrap.innerHTML=`<div class="period-tabs">${showPeriods.map(p=>`<button class="period-tab${p===currentPeriod?' active':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>`;
    tabsWrap.querySelectorAll('.period-tab').forEach(btn=>{
      btn.addEventListener('click',()=>showMenu(restaurantId,null,btn.dataset.p));
    });
  } else {
    tabsWrap.innerHTML='';
  }

  const items=allItems.filter(i=>{
    const p=i.dining_period||'All Day';
    if(currentPeriod==='All Day') return true;
    if(p===currentPeriod) return true;
    if(p==='All Day'&&currentPeriod!=='All Day') return true;
    return false;
  });
  const displayItems = items.length ? items : allItems;

  const groups={};
  for(const item of displayItems){
    const gk=(item.group_display_order??99)+'|'+(item.category_group||'other');
    if(!groups[gk]) groups[gk]={order:item.group_display_order??99,groupName:item.category_group||'other',cats:{}};
    const cat=item.category||item.category_group||'';
    if(!groups[gk].cats[cat]) groups[gk].cats[cat]=[];
    groups[gk].cats[cat].push(item);
  }
  const sortedGroups=Object.values(groups).sort((a,b)=>a.order-b.order);
  let html='';
  for(const g of sortedGroups){
    const displayGroup=g.groupName.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    let gHtml='';
    for(const[cat,catItems] of Object.entries(g.cats)){
      const showSub=cat&&cat.toLowerCase()!==g.groupName.toLowerCase()&&cat.toLowerCase()!==g.groupName.replace(/-/g,' ').toLowerCase();
      if(showSub) gHtml+=`<div class="menu-cat-hd">${esc(cat)}</div>`;
      for(const item of catItems.sort((a,b)=>(a.item||'').localeCompare(b.item||''))){
        const isHL=scrollToItem&&item.item?.toLowerCase()===scrollToItem.toLowerCase();
        const afBadge=item.has_allergy_option?`<button class="af-badge js-af-badge" aria-label="Allergy options available">A</button>`:'';
        const festTag=item.is_festival_item?`<span class="festival-tag">Festival</span>`:'';
        const prevPrice=item.price_changed&&item.previous_price?`<span class="menu-item-changed">$${item.previous_price.toFixed(2)}</span>`:'';
        gHtml+=`<div id="${isHL?'hl-item':''}" class="menu-item${isHL?' highlighted scroll-anchor':''}">
          <div class="menu-item-name">
            <span class="menu-item-name-text">${esc(item.item||'')}</span>
            ${afBadge}${festTag}
          </div>
          ${item.description?`<div class="menu-item-desc">${esc(item.description)}</div>`:''}
          <div class="menu-item-footer">
            ${item.price_display?`<span class="menu-item-price">${esc(item.price_display)}</span>`:''}
            ${prevPrice}
          </div>
        </div>`;
      }
    }
    html+=`<div class="menu-group"><div class="menu-group-hd">${esc(displayGroup)}</div>${gHtml}</div>`;
  }
  if(!html) html='<div class="menu-empty">No menu items found.</div>';
  document.getElementById('menu-content').innerHTML=html;

  document.querySelectorAll('.js-af-badge').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();showAfTooltip(btn);});
  });

  const backLabel=browseStack.length>0?(browseStack[browseStack.length-1]?.label||'Back'):'Search';
  setNav('menu',backLabel,'');showView('menu');

  if(scrollToItem){
    setTimeout(()=>{const el=document.getElementById('hl-item');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},120);
  }
}

// ── SEARCH ─────────────────────────────────────────────
function setupSearch(){
  const input=document.getElementById('search-input');
  const clear=document.getElementById('search-clear');
  let timer;
  input.addEventListener('input',()=>{
    clearTimeout(timer);timer=setTimeout(triggerSearch,100);
    clear.style.display=input.value?'flex':'none';
  });
  // Tapping the bar while a session is tucked (a result is showing) pops
  // back to the browsing state — same term, same results, nothing re-run.
  input.addEventListener('click',()=>{
    if(searchSessionState==='tucked') enterBrowsing();
  });
  clear.addEventListener('click',closeSearchSession);
  document.getElementById('results-back-btn').addEventListener('click', ()=>{
    forcedTypeBrowse = null;
    triggerSearch();
  });
}
function focusSearch(val){
  const input=document.getElementById('search-input');
  input.value=val||'';input.focus();triggerSearch();
}

// User explicitly cleared the bar (typed it empty, or tapped ✕).
// This is the ONLY thing that should erase the session and its filters.
function closeSearchSession(){
  const input = document.getElementById('search-input');
  input.value='';
  input.blur();
  document.getElementById('search-clear').style.display='none';
  if(filterCount()>0){Object.values(filters).forEach(s=>s.clear());buildFilterPanel();}
  searchSessionState='closed';
  resultsActive=false;
  forcedTypeBrowse=null;
  document.getElementById('results-plane').classList.remove('visible');
  document.getElementById('filter-plane').classList.remove('visible');
  filterExpanded=false;
  document.getElementById('filter-plane').classList.remove('expanded');
  requestAnimationFrame(layoutPlanes);
}

// Selecting a result: keep the search term + last-rendered results intact,
// just roll the results/filter panes up so the menu underneath is visible.
// Nothing is cleared — tapping the bar again restores 'browsing' instantly.
function tuckSearchSession(){
  if(searchSessionState==='closed') return; // nothing to tuck
  searchSessionState='tucked';
  resultsActive=false; // panes hidden, but session/term/results preserved
  document.getElementById('results-plane').classList.remove('visible');
  document.getElementById('filter-plane').classList.remove('visible');
  filterExpanded=false;
  document.getElementById('filter-plane').classList.remove('expanded');
  requestAnimationFrame(layoutPlanes);
}

// Returning to the results list from a tucked state (or opening fresh).
function enterBrowsing(){
  searchSessionState='browsing';
  resultsActive=true;
  document.getElementById('results-plane').classList.add('visible');
  document.getElementById('filter-plane').classList.add('visible');
  requestAnimationFrame(layoutPlanes);
}

function triggerSearch(){
  const q=document.getElementById('search-input').value.trim();
  const hasQ=q.length>=1,hasF=filterCount()>0;
  if(hasQ||hasF){
    renderResults(q);
    enterBrowsing();
  } else {
    // Bar emptied via backspace (not the ✕) and no filters active —
    // same end state as an explicit clear: fully close the session.
    closeSearchSession();
  }
}

function getFilteredRestaurants(){
  return RESTAURANTS.filter(r=>{
    if(filters.location.size&&!LOC_TAGS.some(l=>filters.location.has(l.tag)&&r.tags?.includes(l.tag))) return false;
    // character-dining is a boolean flag living in the style Set (it's
    // grouped there in the UI), not an experience_type string — split it
    // out from the rest of the style chips before doing the string match.
    const styleKeys = [...filters.style].filter(k => k !== 'character-dining');
    if(styleKeys.length && !styleKeys.includes(r.experience_type)) return false;
    if(filters.style.has('character-dining') && !r.is_character_dining) return false;
    if(filters.price.size&&!filters.price.has(String(r.price_tier))) return false;
    return true;
  });
}

// Set only when the person taps a type/cuisine suggestion chip. Stores
// both the query it was tapped under AND which specific candidate (by
// label, since multiple can match the same prefix) — compared against
// the CURRENT qLow at render time, so editing the query invalidates it
// automatically with no separate reset needed.
let forcedTypeBrowse = null; // { qLow, label } | null

function renderResults(q){
  const qLow=(q||'').toLowerCase().trim();
  const filteredRests=getFilteredRestaurants();
  const filteredRestIds=new Set(filteredRests.map(r=>r.restaurant_id));

  // Live prefix match — recomputed fresh every render, capped at 3 per
  // category, sorted by restaurant count. Substring search below is
  // completely unaffected by any of this; typing "mexican" still surfaces
  // every menu item with "mexican" in the name exactly as normal search
  // would, alongside separate tappable suggestions the person can act on
  // or just keep typing past.
  const typeCandidates = detectTypeCandidates(qLow);
  const forcedCandidate = (forcedTypeBrowse && forcedTypeBrowse.qLow===qLow)
    ? [...typeCandidates.diningType, ...typeCandidates.cuisine].find(c=>c.label===forcedTypeBrowse.label)
    : null;
  const isForcedBrowse = !!forcedCandidate;

  const restMatches=[];const restSeen=new Set();
  if(isForcedBrowse){
    for(const r of filteredRests){
      if(restSeen.has(r.restaurant_id))continue;
      if(forcedCandidate.test(r)){restMatches.push(r);restSeen.add(r.restaurant_id);}
    }
  } else if(qLow){
    for(const r of filteredRests){
      if(restSeen.has(r.restaurant_id))continue;
      if(r.restaurant?.toLowerCase().includes(qLow)||r.area?.toLowerCase().includes(qLow)){restMatches.push(r);restSeen.add(r.restaurant_id);}
    }
  } else if(filterCount()>0){
    // Filters active but no search text — this is "show me everything
    // matching these filters" (e.g. all Character Dining, or all Table
    // Service in Magic Kingdom).
    for(const r of filteredRests){
      if(restSeen.has(r.restaurant_id))continue;
      restMatches.push(r);restSeen.add(r.restaurant_id);
    }
  }

  // "Browse mode" only kicks in once the type-search has been explicitly
  // confirmed (isForcedBrowse) or for pure filter-only browsing — it no
  // longer activates just because a type keyword was typed, since that
  // would suppress legitimate substring matches (e.g. "mexican" as an
  // ingredient word in an item name at a non-Mexican restaurant).
  const isBrowseMode = isForcedBrowse || (!qLow && filterCount()>0);

  let useAllergyRows=filters.dietary.has('allergy-friendly');
  const hasItemLevelFilter = filters.food.size>0 || filters.meal.size>0 || filters.dietary.size>0;
  const skipItemMatching = isBrowseMode && !hasItemLevelFilter;

  let itemBase = skipItemMatching ? [] : MENUS.filter(i=>{
    if(useAllergyRows){if(!i.is_allergy_friendly)return false;}
    else{if(!i.show_in_menu)return false;}
    if(!filteredRestIds.has(i.restaurant_id))return false;
    if(filters.food.size&&!i.norm_categories?.some(c=>filters.food.has(c)))return false;
    if(filters.meal.size&&!filters.meal.has(i.dining_period))return false;
    if(filters.dietary.has('kids')&&!i.is_kids)return false;
    // 'alcoholic' dietary filter removed — Beer/Wine/Cocktails food-type
    // chips already cover this, no need for a separate redundant toggle.
    return true;
  });
  // Normal substring matching runs whenever there's text, UNLESS browse
  // mode is actively confirmed (isForcedBrowse) — at that point items are
  // already suppressed above via skipItemMatching, so itemBase is empty.
  let itemMatchesRaw=(qLow && !isForcedBrowse)?itemBase.filter(i=>i.item?.toLowerCase().includes(qLow)):itemBase;

  const seenKey=new Set();
  const itemMatches=[];
  for(const item of itemMatchesRaw){
    const key=item.restaurant_id+'|'+(item.item||'').toLowerCase();
    if(seenKey.has(key)) continue;
    seenKey.add(key);
    itemMatches.push(item);
  }

  const distCache={};
  if(proximityActive&&userLat){
    for(const r of RESTAURANTS){if(r.lat)distCache[r.restaurant_id]=dist(userLat,userLng,r.lat,r.lng);}
    restMatches.sort((a,b)=>(distCache[a.restaurant_id]??999)-(distCache[b.restaurant_id]??999));
    itemMatches.sort((a,b)=>(distCache[a.restaurant_id]??999)-(distCache[b.restaurant_id]??999));
  } else {
    restMatches.sort((a,b)=>{const aS=a.restaurant?.toLowerCase().startsWith(qLow)?0:1,bS=b.restaurant?.toLowerCase().startsWith(qLow)?0:1;return aS-bS||a.restaurant?.localeCompare(b.restaurant);});
    itemMatches.sort((a,b)=>{const aS=a.item?.toLowerCase().startsWith(qLow)?0:1,bS=b.item?.toLowerCase().startsWith(qLow)?0:1;return aS-bS||a.item?.localeCompare(b.item);});
  }

  const total=restMatches.length+itemMatches.length;
  const fc=filterCount();
  const backBtn = document.getElementById('results-back-btn');
  if(isForcedBrowse){
    document.getElementById('results-count').textContent = `Browsing ${forcedCandidate.label} (${total.toLocaleString()})`;
    backBtn.classList.add('visible');
  } else {
    document.getElementById('results-count').textContent=total?`${total.toLocaleString()} result${total!==1?'s':''}${fc?' · '+fc+' filter'+(fc!==1?'s':''):''}` :'No results';
    backBtn.classList.remove('visible');
  }
  document.getElementById('results-sort-label').textContent = proximityActive&&userLat ? '⊕ By distance' : '';

  const hasCandidates = !isForcedBrowse && (typeCandidates.diningType.length || typeCandidates.cuisine.length);

  if(!total && !hasCandidates){
    document.getElementById('results-list').innerHTML=`<div class="empty-state"><div class="empty-state-title">Nothing found</div><div class="empty-state-sub">${fc?'Try clearing some filters.':'Check spelling or try a different term.'}</div></div>`;
    return;
  }

  let html='';

  // ── TYPE/CUISINE SUGGESTIONS ──
  // Rendered exactly like the Restaurants section — all-caps header,
  // single-line rows (name / count / arrow) — so they read as just
  // another result type, not a separate promo element.
  const renderTypeSection = (headerLabel, candidates) => {
    if(!candidates.length) return '';
    let out = `<div class="results-section-hd">${esc(headerLabel)}</div>`;
    out += candidates.map(c => `<div class="result-type" data-label="${esc(c.label)}">
      <div class="result-type-name">${esc(c.label)}</div>
      <div class="result-type-right"><span class="result-type-count">${c.count}</span><span class="result-type-arrow">›</span></div>
    </div>`).join('');
    return out;
  };
  if(!isForcedBrowse){
    html += renderTypeSection('Dining Type', typeCandidates.diningType);
    html += renderTypeSection('Cuisine', typeCandidates.cuisine);
  }

  if(restMatches.length){
    html+=`<div class="results-section-hd">Restaurants</div>`;
    // Cap at 10 for text search (you're narrowing toward a specific match,
    // more than 10 isn't useful) but show everything in filter-only or
    // confirmed browse mode.
    const restDisplay = isBrowseMode ? restMatches : restMatches.slice(0,10);
    html+=restDisplay.map(r=>{
      const d=proximityActive&&userLat&&r.lat?fmtDist(dist(userLat,userLng,r.lat,r.lng)):'';
      return `<div class="result-rest" data-rid="${esc(r.restaurant_id)}">
        <div class="result-rest-body">
          <div class="result-rest-name">${highlightMatch(r.restaurant,q)}</div>
          <div class="result-rest-meta">${esc(locationLabel(r))}${r.price_tier?'  '+'$'.repeat(r.price_tier):''}</div>
        </div>
        <div class="result-rest-right">${d?`<span class="result-rest-dist">${esc(d)}</span>`:''}<span class="result-rest-arrow">›</span></div>
      </div>`;
    }).join('');
  }

  if(itemMatches.length){
    if(proximityActive && userLat){
      // Proximity sort stays flat — grouping would fight "closest first".
      html+=`<div class="results-section-hd">Menu items</div>`;
      html+=itemMatches.slice(0,200).map(item=>renderItemRow(item,q)).join('');
    } else {
      // Two-tier grouping: top bucket (Park / Disney Springs / Resorts)
      // sticky-pins at the very top of the scroll; sub-group (area or
      // individual resort name) sticky-pins directly beneath it, swapping
      // as you scroll into each section. Mirrors the iOS Contacts pattern.
      const buckets = {}; // top -> { subOrder: [], subs: { subName: [items] } }
      for(const item of itemMatches.slice(0,300)){
        const r=REST_MAP[item.restaurant_id];
        const {top, sub} = twoTierGroupKey(r);
        if(!buckets[top]) buckets[top] = { subOrder: [], subs: {} };
        if(!buckets[top].subs[sub]){ buckets[top].subs[sub]=[]; buckets[top].subOrder.push(sub); }
        buckets[top].subs[sub].push(item);
      }
      const topKeys = Object.keys(buckets).sort((a,b)=>topBucketSortIndex(a)-topBucketSortIndex(b));
      for(const top of topKeys){
        const b = buckets[top];
        const subKeys = [...b.subOrder].sort((a,b2)=>a.localeCompare(b2));
        html += `<div class="results-top-hd">${esc(top)}</div>`;
        for(const sub of subKeys){
          html += `<div class="results-sub-hd">${esc(sub)}</div>`;
          html += b.subs[sub].map(item=>renderItemRow(item,q)).join('');
        }
      }
    }
  }

  const listEl=document.getElementById('results-list');
  listEl.innerHTML=html;

  // Measure the rendered top-bucket header height so sub-headers pin
  // directly beneath it — robust across themes with different font
  // metrics (Bitter/Poppins render slightly taller than Inter).
  requestAnimationFrame(()=>{
    const topHd = listEl.querySelector('.results-top-hd');
    if(topHd){
      document.documentElement.style.setProperty('--results-top-hd-h', topHd.getBoundingClientRect().height + 'px');
    }
  });

  listEl.querySelectorAll('.result-rest[data-rid]').forEach(el=>{
    el.addEventListener('click',()=>{browseStack=[];currentRestId=el.dataset.rid;tuckSearchSession();showMenu(el.dataset.rid,null,null);});
  });
  listEl.querySelectorAll('.result-type').forEach(el=>{
    el.addEventListener('click', ()=>{
      forcedTypeBrowse = { qLow, label: el.dataset.label };
      triggerSearch();
    });
  });
  listEl.querySelectorAll('.result-item[data-rid]').forEach(el=>{
    el.addEventListener('click',()=>{browseStack=[];currentRestId=el.dataset.rid;tuckSearchSession();showMenu(el.dataset.rid,el.dataset.iname,null);});
  });
  listEl.querySelectorAll('.js-af-badge-result').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();showAfTooltip(btn);});
  });

  requestAnimationFrame(layoutPlanes);
}

function renderItemRow(item,q){
  const r=REST_MAP[item.restaurant_id];
  const d=proximityActive&&userLat&&r?.lat?fmtDist(dist(userLat,userLng,r.lat,r.lng)):'';
  const af=item.has_allergy_option?`<span class="af-badge js-af-badge-result" title="Allergy-friendly option available">A</span>`:'';
  return `<div class="result-item" data-rid="${esc(item.restaurant_id)}" data-iname="${esc(item.item)}">
    <div class="result-item-name">${highlightMatch(item.item,q)}</div>
    <div class="result-item-rest">${esc(r?.restaurant||'')}</div>
    <div class="result-item-footer">
      <span class="result-item-loc">${esc(locationLabel(r)||'')}</span>
      <div class="result-item-right">
        ${d?`<span class="result-item-dist">${esc(d)}</span>`:''}
        ${af}
        ${item.price_display?`<span class="result-item-price">${esc(item.price_display)}</span>`:''}
      </div>
    </div>
  </div>`;
}

// ── FILTER PANEL ───────────────────────────────────────
function buildFilterPanel(){
  const parksEl=document.getElementById('filter-parks');
  parksEl.innerHTML=LOC_TAGS.map(l=>`<button class="chip park-chip${filters.location.has(l.tag)?' active':''}" data-set="location" data-key="${esc(l.tag)}">${esc(l.abbr)}</button>`).join('');

  // Peek row removed — it duplicated the Food Type section directly below
  // and made the park-chip area feel cluttered. Peek state now shows just
  // park chips; swipe up reveals the full filter sections.

  renderFilterSection('fb-food',FOOD_FILTERS,filters.food);
  renderFilterSection('fb-meal',PERIOD_ORDER.map(p=>({key:p,label:p})),filters.meal);
  renderFilterSection('fb-style',STYLE_FILTERS,filters.style);
  renderFilterSection('fb-price',PRICE_FILTERS,filters.price);
  renderFilterSection('fb-dietary',DIETARY_FILTERS,filters.dietary);

  document.querySelectorAll('#filter-plane .chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const set=filters[chip.dataset.set],k=chip.dataset.key;
      if(set.has(k)){set.delete(k);}
      else{set.add(k);}
      document.querySelectorAll(`#filter-plane .chip[data-set="${chip.dataset.set}"][data-key="${CSS.escape(k)}"]`).forEach(c=>c.classList.toggle('active',set.has(k)));
      updateFilterCountBadge();
      triggerSearch();
    });
  });

  document.querySelectorAll('.filter-section-toggle').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const body=document.getElementById(btn.dataset.target);
      btn.classList.toggle('open');body.classList.toggle('open');
    });
  });

  updateFilterCountBadge();
}

function renderFilterSection(bodyId,items,activeSet){
  const el=document.getElementById(bodyId);
  el.innerHTML=`<div class="filter-chips">`+items.map(item=>`<button class="chip${activeSet.has(item.key)?' active':''}" data-set="${bodyId.replace('fb-','')}" data-key="${esc(item.key)}">${esc(item.label)}</button>`).join('')+'</div>';
}

function updateFilterCountBadge(){
  const badge=document.getElementById('filter-count-badge');
  const n=filterCount();
  if(n){badge.textContent=n;badge.style.display='inline-block';}
  else badge.style.display='none';
}

document.getElementById('filter-clear-btn').addEventListener('click',()=>{
  Object.values(filters).forEach(s=>s.clear());
  buildFilterPanel();triggerSearch();
});

// ── FILTER PANEL: peek/expand + swipe gesture ──────────
function setupFilterSwipe(){
  const plane=document.getElementById('filter-plane');
  const handleRow=document.getElementById('filter-handle-row');
  let startY=0, startH=0, dragging=false;

  function getPeekPx(){
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--filter-peek-h')) || 74;
  }

  function expand(){
    filterExpanded=true;
    plane.classList.add('expanded');
    plane.style.height = '';
    requestAnimationFrame(layoutPlanes);
  }
  function collapse(){
    filterExpanded=false;
    plane.classList.remove('expanded');
    plane.style.height = '';
    requestAnimationFrame(layoutPlanes);
  }

  // NOTE: deliberately no separate 'click' listener here. Touch devices
  // fire touchstart->touchend AND then synthesize a 'click' afterward —
  // having both wired up meant a single tap toggled twice (drag-end logic,
  // then the click handler immediately flipping it back). A tap with zero
  // movement is just a drag with delta=0, which onEnd() already handles
  // correctly via the height/midpoint comparison below.
  function onStart(e){
    if(e.target.id==='filter-clear-btn') return; // let Clear's own click handler fire undisturbed
    dragging=true;
    startY = (e.touches? e.touches[0].clientY : e.clientY);
    startH = plane.getBoundingClientRect().height;
    plane.style.transition='none';
  }
  function onMove(e){
    if(!dragging) return;
    const y = (e.touches? e.touches[0].clientY : e.clientY);
    const delta = startY - y;
    let newH = startH + delta;
    const peekPx = getPeekPx(), maxPx = window.innerHeight * 0.27;
    newH = Math.max(peekPx, Math.min(maxPx, newH));
    plane.style.height = newH + 'px';
    requestAnimationFrame(layoutPlanes);
    if(e.cancelable) e.preventDefault();
  }
  function onEnd(){
    if(!dragging) return;
    dragging=false;
    plane.style.transition='';
    const curH = plane.getBoundingClientRect().height;
    const peekPx = getPeekPx(), maxPx = window.innerHeight * 0.27;
    const midpoint = (peekPx + maxPx) / 2;
    if(curH > midpoint) expand(); else collapse();
  }

  handleRow.addEventListener('touchstart', onStart, {passive:true});
  handleRow.addEventListener('touchmove', onMove, {passive:false});
  handleRow.addEventListener('touchend', onEnd);
  handleRow.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

// ── ALLERGY TOOLTIP ────────────────────────────────────
function setupAllergyTooltip(){
  document.getElementById('af-tooltip-close').addEventListener('click',hideAfTooltip);
}
function showAfTooltip(anchor){
  const tip=document.getElementById('af-tooltip');
  tip.style.display='block';
  const rect=anchor.getBoundingClientRect();
  const tipH=190,tipW=260;
  let top=rect.bottom+8,left=rect.left;
  if(top+tipH>window.innerHeight) top=rect.top-tipH-8;
  if(left+tipW>window.innerWidth-12) left=window.innerWidth-tipW-12;
  tip.style.top=top+'px';tip.style.left=Math.max(12,left)+'px';
}
function hideAfTooltip(){ document.getElementById('af-tooltip').style.display='none'; }
document.addEventListener('click',e=>{
  const tip=document.getElementById('af-tooltip');
  if(tip.style.display==='block'&&!tip.contains(e.target)&&!e.target.classList.contains('af-badge')&&!e.target.classList.contains('js-af-badge-result')&&!e.target.classList.contains('js-af-badge'))
    hideAfTooltip();
});

// ── SPECIAL VIEWS ──────────────────────────────────────
function showFestivalItems(){
  const items=MENUS.filter(i=>i.is_festival_item&&i.show_in_menu);
  renderSpecialList(items,'🎪 Festival items',`${items.length} special items`);
}
function showPriceChanges(){
  const items=MENUS.filter(i=>i.show_in_menu&&i.price_changed);
  renderSpecialList(items,'🔄 Price changes',`${items.length} items updated recently`);
}
function renderSpecialList(items,heading,countText){
  document.getElementById('search-input').value='';
  // Special lists (Festival, Price Changes) aren't a "search session" in the
  // tuck/restore sense — they're launched from home cards with an empty bar,
  // so there's no term to preserve. Treat selection as a full close.
  searchSessionState='browsing';
  resultsActive=true;
  document.getElementById('results-plane').classList.add('visible');
  document.getElementById('filter-plane').classList.add('visible');
  document.getElementById('results-count').textContent=countText;
  document.getElementById('results-sort-label').textContent='';
  document.getElementById('results-back-btn').classList.remove('visible');
  let html=`<div class="results-section-hd">${esc(heading)}</div>`;
  html+=items.slice(0,200).map(item=>{
    const r=REST_MAP[item.restaurant_id];
    const prev=item.price_changed&&item.previous_price?`<span class="menu-item-changed" style="font-size:11px;margin-left:4px">was $${item.previous_price.toFixed(2)}</span>`:'';
    return `<div class="result-item" data-rid="${esc(item.restaurant_id)}" data-iname="${esc(item.item)}">
      <div class="result-item-name">${esc(item.item||'')}</div>
      <div class="result-item-rest">${esc(r?.restaurant||'')}</div>
      <div class="result-item-footer">
        <span class="result-item-loc">${esc(locationLabel(r)||'')}</span>
        <div class="result-item-right">${item.price_display?`<span class="result-item-price">${esc(item.price_display)}</span>`:''}${prev}</div>
      </div>
    </div>`;
  }).join('');
  const listEl=document.getElementById('results-list');
  listEl.innerHTML=html;
  listEl.querySelectorAll('.result-item[data-rid]').forEach(el=>{
    el.addEventListener('click',()=>{browseStack=[];closeSearchSession();showMenu(el.dataset.rid,el.dataset.iname,null);});
  });
  requestAnimationFrame(layoutPlanes);
}

// ── MAPS CARD ──────────────────────────────────────────
function setupMapsCard(){
  document.getElementById('maps-card-close').addEventListener('click',hideMapsCard);
  document.getElementById('maps-overlay-bg').addEventListener('click',hideMapsCard);
}
function showMapsCard(r){
  const lat=r.lat,lng=r.lng,name=r.restaurant,rname=encodeURIComponent(name);
  document.getElementById('maps-card-name').textContent=name;
  document.getElementById('maps-btn-map').href=`https://maps.apple.com/?q=${rname}&ll=${lat},${lng}`;
  document.getElementById('maps-btn-walk').href=`https://maps.apple.com/?daddr=${lat},${lng}&dirflg=w`;
  document.getElementById('maps-btn-drive').href=`https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;
  const disneyBtn=document.getElementById('maps-btn-disney');
  if(r.disney_url){disneyBtn.href=r.disney_url;disneyBtn.style.display='flex';}
  else disneyBtn.style.display='none';
  document.getElementById('maps-overlay-bg').classList.add('visible');
  document.getElementById('maps-card').classList.add('visible');
}
function hideMapsCard(){
  document.getElementById('maps-overlay-bg').classList.remove('visible');
  document.getElementById('maps-card').classList.remove('visible');
}
